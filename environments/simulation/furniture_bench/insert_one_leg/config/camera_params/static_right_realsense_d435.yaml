# !!! IMPORTANT !!!
# There is a known limitation in the Omniverse camera model:
# https://github.com/isaac-sim/IsaacLab/blob/91ad4944f2b7fad29d52c04a5264a082bcaad71d/source/isaaclab/isaaclab/sensors/camera/camera.py#L239
#
# As a result, we cannot directly use the optical center values (cx, cy) obtained through calibration or optimization.
# Instead, the optical center must be set to the center of the image as follows:
#
#     cx = width / 2
#     cy = height / 2
#
# Otherwise, the camera will be incorrectly configured, and depth images will be distorted.
# This distortion is not always apparent when inspecting single depth images, but it becomes apparent when fusing depth data from multiple cameras (e.g., in point cloud generation or 3D reconstruction).
intrinsics:
  resolution:
    480x640:  [386.829, 0, 320.0, 0, 386.829, 240.0, 0, 0, 1]

extrinsics: [-0.5411,  0.3109, -0.7814,  1.0185, 0.8409,  0.2101, -0.4987,  0.3440, 0.0092, -0.9269, -0.3752,  0.3337, 0.0000,  0.0000,  0.0000,  1.0000]