channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pylint
  - rope
  - numpy
  - pip
  - pip:
    - torch~=2.5.0  # latest version supported by torch_geometric
    - lightning
    - torchvision
    - torch_geometric
    - tensordict
    - einops
    - hydra-core==1.3.2
    - hydra_colorlog
    - wandb
    - h5py  # libero dataset
    - scipy  # for numerical integration in linear multistep sampler
    - torchsde  # for BrownianTreeNoiseSampler in stochastic DPM-Solver++
    - ftfy  # for CLIP tokenizer
