channels:
  - conda-forge
  - nodefaults
  - pytorch
  - nvidia
dependencies:
  - python=3.10
  - pytorch=2.4.1  # latest version supported by torch_geometric v2.6
  - torchvision=0.19.1
  - pytorch-cuda=12.4
  - pyg::pyg=2.6
  - lightning
  - tensordict
  - torchsde  # for BrownianTreeNoiseSampler in stochastic DPM-Solver++
  - pylint
  - rope
  - numpy
  - scipy  # for numerical integration in linear multistep sampler
  - pip
  - pip:
    - einops
    - frozendict  # for immutable dictionaries in DataSpecs obs and goal properties
    - hydra-core==1.3.2
    - hydra_colorlog
    - wandb
    - rich  # for Lightning rich model summary
    - h5py  # libero dataset
    - ftfy  # for CLIP tokenizer
