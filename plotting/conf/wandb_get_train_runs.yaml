defaults:
  - series: main_roca_pp
  - _self_
  # enable color logging
  - override hydra/hydra_logging: colorlog
  - override hydra/job_logging: colorlog

entity: alr-3d-sim2real
project: 3d-sim2real

job_type: train
cfg_filters: null

group_by_config_keys:
  - data.name
  # - agent.obs_encoder.t10_image_tokenizer.encoder.pretrained

hydra:
  job_logging:
    handlers:
      file:
        # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
        filename: ${hydra:runtime.output_dir}/${hydra:job.config_name}.log
