results_file: stats/2026-03-31_11-59-27/series-main_ms_pointtransformer/results.yaml

hydra:
  # output directory, generated dynamically on each run
  run:
    dir: tables/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: tables/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        kv_sep: "-"
        item_sep: _

  job_logging:
    handlers:
      file:
        # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
        filename: ${hydra:runtime.output_dir}/${hydra:job.config_name}.log
