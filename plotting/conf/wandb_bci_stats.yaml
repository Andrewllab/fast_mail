defaults:
  - series: main_roca_pp
  - _self_
  # enable color logging
  - override hydra/hydra_logging: colorlog
  - override hydra/job_logging: colorlog

entity: alr-3d-sim2real
project: 3d-sim2real

job_type: test_sim
cfg_filters:
  data.env.num_episodes: 50
  data.env.env_name:
    $in: [TurnOnSinkFaucet, TurnOffSinkFaucet, TurnSinkSpout]

expected_seeds: 3
verify_n_ckpt_epochs: False

n_iterations: 1000
n_samples: 50

hydra:
  # output directory, generated dynamically on each run
  run:
    dir: stats/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: stats/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        kv_sep: "-"
        item_sep: _

  job_logging:
    handlers:
      file:
        # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
        filename: ${hydra:runtime.output_dir}/${hydra:job.config_name}.log
