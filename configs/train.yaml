defaults:
  - dataset: one_leg
  - augmentation: null
  - agent: beso_agent
  - callbacks:
    - model_checkpoint
    - model_summary
  - logger: 
    - wandb
    - csv
  - python_logging: default
  - paths: default
  - hydra: default
  - _self_
  - experiment: null
  - platform: default
  - optional local: default
  - debug: null

# task name, determines output directory path
task_name: train

wandb:
  tags: null
  notes: null

seed: null

disable_validation: True

dataloader:
  batch_size: 256
  num_workers: 4

sim_dataloader:
  batch_size: 1
  num_workers: 0

trainer:
  deterministic: True
  accelerator: gpu
  devices: auto
  default_root_dir: ${paths.output_dir}
  max_epochs: 100
  check_val_every_n_epoch: 1
