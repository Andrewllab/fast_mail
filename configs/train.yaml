defaults:
  - dataset: one_leg
  - augmentation: null
  - agent: beso_agent
  - trainer: base_trainer
  - logging: default
  - paths: default
  - hydra: default
  - _self_
  - optional local: default
  - platform: default
  - experiment: null


wandb:
  tags: null
  notes: null

seed: null


# dataset config
task_suite: pushT
traj_per_task: 200

# Model Setting
window_size: 10
obs_seq_len: 1
act_seq_len: ${window_size}
goal_window_size: 1
goal_conditioned: False

use_pos_emb: True
num_sampling_steps: 4

obs_tokens: 1

# Training
train_batch_size: 256
val_batch_size: 32
num_workers: 4
device: cuda
epoch: 100

# BALAZS: where do these belong?
scale_data: True
scaler_type: minmax
if_use_ema: True

## Environment
obs_dim: 9
action_dim: 2
state_dim: 110
max_len_data: 260

## Observations
if_robot_states: False

shape_meta:
  # acceptable types: rgb, low_dim
  obs:
    agentview_rgb_image:
      shape: [ 3, 224, 224 ]
      type: rgb

##########################################################################################
# Common Parameters
##########################################################################################
n_embd: 256
goal_dim: 16
latent_dim: 256

##########################################################################################
# Transformer Parameters (encoder-decoder)
##########################################################################################
encoder_n_layer: 4
decoder_n_layer: 6
n_heads: 4
