defaults:
  - dataset: one_leg
  - augmentation: null
  - agent: beso_agent
  # - trainer: base_trainer
  - logging: default
  - paths: default
  - hydra: default
  - _self_
  - optional local: default
  - platform: default
  - experiment: null


wandb:
  tags: null
  notes: null

seed: null

disable_validation: True

dataloader:
  batch_size: 256
  num_workers: 4

sim_dataloader:
  batch_size: 1
  num_workers: 0

trainer:
  deterministic: True
  accelerator: auto
  devices: auto
  default_root_dir: ${hydra:runtime.output_dir}
  max_epochs: 100
  check_val_every_n_epoch: 1
  # enable_checkpointing: False
  # fast_dev_run: True
  callbacks:
    - {
        _target_: lightning.pytorch.callbacks.ModelCheckpoint, 
        every_n_epochs: 2,
        save_weights_only: True,
      }

# dataset config
task_suite: pushT
traj_per_task: 200

# Model Setting
window_size: 10
obs_seq_len: 1
act_seq_len: ${window_size}
goal_window_size: 1
goal_conditioned: False

use_pos_emb: True

obs_tokens: 1

# Training
val_batch_size: 32

# BALAZS: where do these belong?
if_use_ema: True

## Environment
obs_dim: 9
action_dim: 2
state_dim: 110
max_len_data: 260

## Observations
if_robot_states: False

shape_meta:
  # acceptable types: rgb, low_dim
  obs:
    agentview_rgb_image:
      shape: [ 3, 224, 224 ]
      type: rgb

##########################################################################################
# Common Parameters
##########################################################################################
n_embd: 256
goal_dim: 16
latent_dim: 256

##########################################################################################
# Transformer Parameters (encoder-decoder)
##########################################################################################
encoder_n_layer: 4
decoder_n_layer: 6
n_heads: 4
