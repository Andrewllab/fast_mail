# @package _global_

defaults:
  # convert to pointmap
  - /transforms@data.preprocess.t5_to_pointmap: to_pointmap

  # we can't really crop because of the random world frame, but the cameras don't see any faraway points anyway  

  # no need to apply random transform for robocasa, since this is in the dataset already

  # # Collect statistics to scale pointmaps to [-1, 1]^3
  # # Do this after translations/cropping and before masking/jittering
  # - /transforms@data.preprocess.t6-2_pointmap_normalize: pointmap_normalize

  - /transforms@data.preprocess.t99_cleanup: cleanup

  # apply jitter data augmentation
  - /transforms@data.gpu_batch_transforms.t2_jitter: translational_jitter

  # apply ImageNet normalization
  - /transforms@data.gpu_batch_transforms.t99_norm_image: imagenet_norm

data:
  preprocess:
    root_dir: ${paths.preprocessed_dir}/robocasa/${data.task}_pointmaps

    t5_to_pointmap:
      color: False  # to use 6-channel fusion, use sim_pointmaps_6ch config
      max_depth: null # in meters

    t99_cleanup:
      # keep rgb streams if MultiviewPointMapTokenizer fusion type is not None (or can't be resolved)
      keep_stream_types: ${if:${oc.select:agent.obs_encoder.t10_image_tokenizer.fusion_type,True},[pointmap,rgb],[pointmap]}
      drop_stream_names: right  # even if we keep rgb streams, drop the right rgb stream
      drop_keys: [left_cam_pose, right_cam_pose, gripper_cam_pose]

  gpu_batch_transforms:
    t2_jitter:
      max_sigma: 0.002
