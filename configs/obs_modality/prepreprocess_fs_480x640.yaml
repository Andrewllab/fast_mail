# @package _global_

defaults:
  - /transforms@data.preprocess_transforms.t0-99_drop_zed_right: cleanup

  # replace measured depth with FoundationStereo depth
  # - /transforms@data.preprocess_transforms.t1-2_foundationstereo: foundation_stereo

  # mask out invalid depth values
  - /transforms@data.preprocess_transforms.t1-3_remove_inf_depth: remove_inf_depth

  - /transforms@data.preprocess_transforms.t9_cleanup: cleanup

data:
  preprocess_transforms:
    # remove right streams from ZED cameras so we have less data to move to GPU
    t0-99_drop_zed_right:
      drop_streams: [front_left_cam/right, front_right_cam/right]

    t1-2_foundationstereo:
      # We only replace gripper_cam depth.
      # The left and right cams have low resolution.
      # Hence zed's neural depth mode actually works better
      # than foundation stereo
      cam_keys: gripper_cam

    # remove the IR streams from the realsense camera, now that we have used
    # them to compute depth
    t9_cleanup:
      keep_stream_types: [rgb, depth]

  dataset:
    preprocessed_dir: ${append_to_stem:${data.dataset.root_dir},_fs_480x640}
