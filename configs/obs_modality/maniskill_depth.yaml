# @package _global_

defaults:
  - /transforms@data.preprocess.t10_resize: image_resize

  - /transforms@data.preprocess.t99_cleanup: cleanup

  # apply jitter data augmentation
  - /transforms@data.gpu_batch_transforms.t10_jitter: jitter

data:
  preprocess:
    # we save the preprocessed data to a unique path so as not to overwrite other obs modalities
    root_dir: ${paths.preprocessed_dir}/${data.task_suite}/${data.name}_depth

    t10_resize:
      shape: 128  # rescale streams from 256x256 to 128x128

    t99_cleanup:
      keep_stream_types: depth  # only keep depth streams

  gpu_batch_transforms:
    t10_jitter:
      sigma: 0.005  # slightly higher jitter for robocasa

# metadata
modality: depth
