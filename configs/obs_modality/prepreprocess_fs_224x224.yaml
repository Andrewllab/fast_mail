# @package _global_

defaults:
  - /transforms@data.preprocess_transforms.t0-99_drop_zed_right: cleanup

  # replace measured depth with FoundationStereo depth
  - /transforms@data.preprocess_transforms.t1-2_foundationstereo: foundation_stereo

  # replace infrared from gripper
  - /transforms@data.preprocess_transforms.t1-2_drop_gripper_ir: cleanup

  # mask out invalid depth values
  - /transforms@data.preprocess_transforms.t1-3_remove_inf_depth: remove_inf_depth

  - /transforms@data.preprocess_transforms.t1-4_resize: image_resize

  # pretrained resnet18 expects images of shape 224x224
  - /transforms@data.preprocess_transforms.t1-5_crop_image: image_centercrop

  - /transforms@data.preprocess_transforms.t1-9_cleanup: cleanup

data:
  preprocess_transforms:
    # remove right streams from ZED cameras so we have less data to move to GPU
    t0-99_drop_zed_right:
      drop_streams: [front_left_cam/right, front_right_cam/right]

    t1-2_foundationstereo:
      # We only replace gripper_cam depth.
      # The left and right cams have low resolution.
      # Hence zed's neural depth mode actually works better
      # than foundation stereo
      cam_keys: gripper_cam
      engine_path: ${paths.fs_engines_dir}/foundation_stereo_small_1x480x640.plan

    t1-4_resize:
      shape: 224  # scale shortest side to 224 and keep aspect ratio
    
    t1-5_crop_image:
      shape: 224  # crop to 224x224 square

    t1-9_cleanup:
      drop_stream_types: [ir]  # drop IR streams from the realsense
      drop_stream_names: [right]  # drop right rgb stream from the zeds

  dataset:
    preprocessed_dir: ${append_to_stem:${data.dataset.root_dir},_fs_224x224}
