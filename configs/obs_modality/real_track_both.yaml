# @package _global_

defaults:

  # Larger vision tasks 
  # - /goals@data.prepreprocess.t01_target_tool_from_foldername: add_target_tool_from_foldername_real
  - /transforms@data.prepreprocess.t02_samv3: pointed_samv3
  - /transforms@data.prepreprocess.t03_dinov3: dinov3
  - /transforms@data.prepreprocess.t04_cotracker: cotracker_both
  - /transforms@data.prepreprocess.t05_tool_to_tracked_featured_pointcloud: to_tracked_featured_pointcloud
  - /transforms@data.prepreprocess.t06_target_to_tracked_featured_pointcloud: to_tracked_featured_pointcloud
  - /transforms@data.prepreprocess.t99_cleanup: cleanup

  # Last little part that connects everyting
  - /transforms@data.preprocess.t02_ee_pose_to_five_points: absolute_ee_pose_to_five_points
  - /transforms@data.preprocess.t03_to_sliding_window_action: to_sliding_window_action
  - /transforms@data.preprocess.t99_cleanup: cleanup

  # GPU batch transforms which happen every batch and should be fast
  - /transforms@data.gpu_batch_transforms.t01_fps_prep: nested_pointcloud_prep_downsample_fps
  - /transforms@data.gpu_batch_transforms.t02_pakt_localizer: pakt_localizer
  - /transforms@data.gpu_batch_transforms.t03_merge_target_into_tool: merge_target_into_tool_pointcloud
  - /transforms@data.gpu_batch_transforms.t04_to_pakt_action_obs: to_pakt_action_obs
  - /transforms@data.gpu_batch_transforms.t05_random_rotation: pakt_random_rotation

  # - /transforms@data.gpu_batch_transforms.t99_render_pcd: pakt_render_pointcloud


camera_keys: ["front_left_cam", "front_right_cam"]
rgb_key: left

data:
  # Below is just the default configuration copied here for convenience. Change as needed.
  prepreprocess:
    backend: hdf5
    # we save the preprocessed data to a unique path so as not to overwrite other obs modalities
    root_dir: ${paths.preprepreprocessed_dir}/real/${data.name}_pointclouds
    overwrite: True
    
    t05_tool_to_tracked_featured_pointcloud:
      track_key: tool_cotracker_tracks
      visibility_key: tool_cotracker_visibility
      out_key: tool_points

    t06_target_to_tracked_featured_pointcloud:
      track_key: target_cotracker_tracks
      visibility_key: target_cotracker_visibility
      out_key: target_points

    t99_cleanup:
      keep_stream_types: []  # keep no stream types, i.e. remove all
      drop_keys: [front_left_cam, front_right_cam, gripper_cam]
    

  preprocess:
    backend: pakt_hdf5
    # we save the preprocessed data to a unique path so as not to overwrite other obs modalities
    root_dir: ${paths.preprocessed_dir}/real/${data.name}_pointclouds
    overwrite: True

    t0_gripper_actions:
      _target_: transforms.action_binarize_gripper.BinarizeGripperActions
      _partial_: True
      threshold: null  # use half the max gripper width as threshold
      hysteris_steps: 30  # issue a warning if state changes happen more frequently than this 

    t01_action_type:
      _target_: transforms.action_switch_type.SwitchActionType
      _partial_: True
      obs_key: next_target_ee_pose

    t02_ee_pose_to_five_points:
      apply_base_pose: False 
      quat_action: True

    t99_cleanup:
      keep_stream_types: []  # keep no stream types, i.e. remove all
      drop_keys: [left_cam_pose, right_cam_pose, gripper_cam_pose, front_left_cam, front_right_cam, gripper_cam]
  
# disable the batch size finder for point clouds, because the data points 
# don't have a consistent memory size
callbacks:
  batch_size_finder: null

# metadata
modality: pointcloud
