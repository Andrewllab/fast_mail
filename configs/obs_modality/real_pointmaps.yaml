# @package _global_

defaults:
  - /transforms@data.preprocess_transforms.t5-1_to_pointmap: to_pointmap

  # Crop out regions outside the area of interest
  - /transforms@data.preprocess_transforms.t5-2_crop_pointmap: pointmap_crop_real

  # Do this before triangle cropping such that the translation is not applied to masked values
  - /transforms@data.preprocess_transforms.t6-1_pointmap_random_transform: pointmap_random_transform

  # Collect statistics to scale pointmaps to [-1, 1]^3
  # Do this after translations/cropping and before masking/jittering
  - /transforms@data.preprocess_transforms.t6-2_pointmap_normalize: pointmap_normalize

  # Apply jitter to images and pointmaps
  - /transforms@data.gpu_batch_transforms.t97-1_color_jitter: image_jitter_color
  - /transforms@data.gpu_batch_transforms.t97-2_pointmap_jitter: translational_jitter

  # Crop out regions outside the area of interest
  - /transforms@data.gpu_batch_transforms.t98_triangle_crop: triangle_crop_224x224

  # apply ImageNet normalization
  - /transforms@data.gpu_batch_transforms.t99_norm_image: imagenet_norm

data:
  preprocess_transforms:
    t5-1_to_pointmap:
      color: false  # to use 6-channel fusion, use real_pointmaps_6ch config
      max_depth: null # in meters
      
    t5-2_crop_pointmap:
      x_range: [-0., 1.0] # crop out the base of the robot
      y_range: [-0.4, 0.4]  # [min, max] or null
      z_range: [0, 1.0]  # just high enough to remove the table

    t6-1_pointmap_random_transform:
      max_angle: 20 # in degrees,
      max_translation: [0.25, 0.25, 0.25] # in meters