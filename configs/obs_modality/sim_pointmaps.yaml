# @package _global_

defaults:
  # convert to pointmap
  - /transforms@data.preprocess_transforms.t5_to_pointmap: to_pointmap

  - /transforms@data.preprocess_transforms.t9_cleanup: cleanup

  # apply ImageNet normalization
  - /transforms@data.gpu_batch_transforms.t4_norm_image: imagenet_norm

data:
  preprocess_transforms:
    t5_to_pointmap:
      color: False  # to use 6-channel fusion, use sim_pointmaps_6ch config

    t9_cleanup:
      # keep rgb streams if MultiviewPointMapTokenizer fusion type is not None (or can't be resolved)
      keep_stream_types: ${if:${oc.select:agent.obs_encoder.t10_image_tokenizer.fusion_type,True},[pointmap,rgb],[pointmap]}
      drop_streams: right  # even if we keep rgb streams, drop the right rgb stream
      drop_keys: gripper_cam_transform

  # we save the preprocessed data to a unique path so as not to overwrite other obs modalities
  dataset:
    preprocessed_dir: ${paths.preprocessed_dir}/${data.name}/multiview_pointmap
