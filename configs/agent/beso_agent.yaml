defaults:
  - noise_model: decoder_only
  - optimizer: adamw
  - lr_scheduler: none
  - obs_encoder: default
  - scaler: minmax
  - goal_encoder: none
  - sampler: ddim
  - noise_distribution: loglogistic
  - noise_schedule: exponential
  - _self_

_target_: agents.beso_agent.BesoAgent

# Arguments passed at runtime:
# dataset: ???

# diffusion params
num_sampling_steps: 4
sigma_data: 0.5
sigma_min: 0.001
sigma_max: 80

ema_decay: 0.995
