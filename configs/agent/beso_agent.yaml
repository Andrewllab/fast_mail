defaults:
  - model: beso/beso_dec_transformer
  - optimizer: adamw
  - lr_scheduler: tristage
  - obs_encoder: default
  - robot_state_encoder: linear
  - scaler: minmax
  - language_encoder: none
  - sampler: ddim
  - noise_distribution: loglogistic
  - noise_schedule: exponential

_target_: agents.beso_agent.BesoAgent

# Arguments required at runtime:
# dataset: ???

latent_dim: ${latent_dim}

# diffusion params
num_sampling_steps: 4
sigma_data: 0.5
sigma_min: 0.001
sigma_max: 80

# TODO: currently not supported
# required refactor so that all learnable parameters are inside single torch Module inside lighning Module
# decay_ema: 0.995
