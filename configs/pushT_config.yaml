defaults:
  - agents: bc_agent
  - trainers: base_trainer
#  - override hydra/launcher: submitit_slurm

# agent_name: beso
agent_name: bc
log_dir: logs/${task_suite}/

# insert wandb here
wandb:
  entity: x-huang
  project: fast_mail

group: bc_${task_suite}

hydra:
  mode: MULTIRUN  # needed for launcher to be used
  run:
    dir: ${log_dir}/runs/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: True
  sweep:
    dir: ${log_dir}/sweeps/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
#  launcher:
#    account: hk-project-sustainebot
#    timeout_min: 500
#    name: libero #${hydra.job.name}
#    partition: accelerated
#    #    gpus_per_node: 4
#    gres: gpu:1
##    cpus-per-task: 152
##    additional_parameters: { "ntasks": 1, "gres": gpu:4, "cpus-per-task": 152 }

seed: 42

# dataset config
task_suite: pushT
traj_per_task: 300

## change the path of dataset
# dataset_path: /home/david/2024/datasets/${task_suite}
#dataset_path: /home/xuan/datasets/${task_suite}
#dataset_path: /hkfs/work/workspace/scratch/ll6323-david_dataset/data/libero/${task_suite}
dataset_path: /home/huang/ml_workspace/fast_mail_workspace/datasets/${task_suite}

# Model Setting
window_size: 10
obs_seq_len: 1
act_seq_len: ${window_size}
goal_window_size: 1
goal_conditioned: False

# obs_tokens: goal_window_size + obs_seq_len * len(obs_modalities)
obs_tokens: 3

# Training
train_batch_size: 128
val_batch_size: 32
num_workers: 4
device: 'cuda'
epoch: 15
eval_every_n_epochs: 1
scale_data: True
scaler_type: 'standard'

## Environment
obs_dim: 9
action_dim: 2
state_dim: 110
max_len_data: 260

## Observations
if_robot_states: False
shape_meta:
  # acceptable types: rgb, low_dim
  obs:
    agentview_rgb:
      shape: [ 3, 224, 224 ]
      type: rgb

##########################################################################################
# Common Parameters
##########################################################################################
n_embd: 256
goal_dim: 16
latent_dim: 256

##########################################################################################
# Transformer Parameters (encoder-decoder)
##########################################################################################
encoder_n_layer: 4
decoder_n_layer: 6
n_heads: 4

##########################################################################################
# Mamba Parameters
##########################################################################################
Mamba_type: Mamba2

mamba_n_layer_encoder: 10
mamba_encoder_cfg:
  layer: ${Mamba_type}
  d_state: 64
  d_conv: 4
  expand: 2

mamba_n_layer_decoder: 10
mamba_decoder_cfg:
  layer: ${Mamba_type}
  d_state: 64
  d_conv: 4
  expand: 2

##########################################################################################
# xLSTM Parameters
##########################################################################################


# Dataset
trainset:
  _target_: environments.dataset.pusht_dataset.PushTDataset
  data_directory: ${dataset_path}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  state_dim: ${state_dim}
  max_len_data: ${max_len_data}
  window_size: ${window_size}
  traj_per_task: ${traj_per_task}

valset:
  _target_: environments.dataset.pusht_dataset.PushTDataset
  data_directory: ${dataset_path}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  state_dim: ${state_dim}
  max_len_data: ${max_len_data}
  window_size: ${window_size}
  traj_per_task: ${traj_per_task}

## TODO
simulation:
  _target_: simulation.pusht_sim.PushTSim
  _convert_: all
  seed: ${seed}
  device: ${device}
  render: True
  n_cores: 2
  n_test_tasks: 20
  num_episode: 2
  max_step_per_episode: 600
  use_multiprocessing: false
  debug_dataset: ${trainset}