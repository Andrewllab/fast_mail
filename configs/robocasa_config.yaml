defaults:
  - agents: equibot_agent
  - trainers: equibot_trainer

agent_name: equibot
log_dir: logs/${env_name}/

# insert wandb here
wandb:
  entity: tiger_or_cat
  project: fast_mail
  
group: bc_${env_name}

hydra:
  mode: MULTIRUN # needed for launcher to be used
  run:
    dir: ${log_dir}/runs/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: True
  sweep:
    dir: ${log_dir}/sweeps/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
#  launcher:
#    account: hk-project-sustainebot
#    timeout_min: 500
#    name: libero #${hydra.job.name}
#    partition: accelerated
#    #    gpus_per_node: 4
#    gres: gpu:1
##    cpus-per-task: 152
##    additional_parameters: { "ntasks": 1, "gres": gpu:4, "cpus-per-task": 152 }

env_name: PnPCabToCounter
seed: 42
camera_names:
  - "robot0_agentview_center"
  - "robot0_agentview_left"
  - "robot0_agentview_right"

dataset_path: /home/i53/student/donat/master_thesis/robocasa/datasets/v0.1/single_stage/kitchen_pnp/PnPCabToCounter/2024-04-24/processed_demo_2.hdf5

# Model Setting
window_size: ${add:${obs_seq_len},${pred_seq_len},-1}
obs_seq_len: 2
act_seq_len: 8
pred_seq_len: 16
multistep: ${window_size} # only for inference, could be different from act_seq_len
goal_window_size: 1

goal_conditioned: True

# Training
train_batch_size: 64
val_batch_size: 64
num_workers: 8
device: 'cuda'
epoch: 2000
eval_every_n_epochs: 1
scale_data: False
scaler_type: 'standard'

## Environment
obs_dim: 13
action_dim: 7
max_len_data: 260

obs_tokens: ${obs_seq_len}

## Observations
if_robot_states: False
img_width: 128
img_height: 128
shape_meta:
  # acceptable types: rgb, low_dim
  obs:
    robot0_agentview_center_image:
      shape:
        - 3
        - ${img_height}
        - ${img_width}
      type: rgb
    # robot0_agentview_left_image:
    #   shape:
    #     - 3
    #     - ${img_height}
    #     - ${img_width}
    #   type: rgb
    # robot0_agentview_right_image:
    #   shape:
    #     - 3
    #     - ${img_height}
    #     - ${img_width}
    #   type: rgb

##########################################################################################
# Common Parameters
##########################################################################################
n_embd: 256
goal_dim: 1024
latent_dim: 256

##########################################################################################
# Transformer Parameters (encoder-decoder)
##########################################################################################
encoder_n_layer: 4
decoder_n_layer: 6
n_heads: 4

##########################################################################################
# Mamba Parameters
##########################################################################################
Mamba_type: Mamba2

mamba_n_layer_encoder: 10
mamba_encoder_cfg:
  layer: ${Mamba_type}
  d_state: 64
  d_conv: 4
  expand: 2

mamba_n_layer_decoder: 10
mamba_decoder_cfg:
  layer: ${Mamba_type}
  d_state: 64
  d_conv: 4
  expand: 2

##########################################################################################
# xLSTM Parameters
##########################################################################################

trainset:
  _target_: environments.dataset.robocasa_dataset.RobocasaDataset
  data_directory: ${dataset_path}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  cam_names: ${camera_names}
  device: ${device}
  max_len_data: ${max_len_data}
  window_size: ${window_size}

valset:
  _target_: environments.dataset.robocasa_dataset.RobocasaDataset
  data_directory: ${dataset_path}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  cam_names: ${camera_names}
  device: ${device}
  max_len_data: ${max_len_data}
  window_size: ${window_size}

simulation:
  _target_: simulation.robocasa_sim.RoboCasaSim
  env_name: ${env_name}
  camera_names: ${camera_names}
  seed: ${seed}
  device: ${device}
  img_height: ${img_height}
  img_width: ${img_width}
  num_episode: 20
  max_step_per_episode: 400
  render: True
  n_cores: 1
  if_vision: True