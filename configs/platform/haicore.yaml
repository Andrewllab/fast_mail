# @package _global_

defaults:
  - kit_hpc
  - _self_

platform:
  name: haicore
  batch_size: 128
  num_workers: 36  # node has 152 cores = 38 cores per GPU

hydra:
  launcher:
    account: anthropomatik  # not sure if this is needed
    timeout_min: 1440  # 24 hours
    partition: normal  # normal and advanced are almost identical, and both have GPUs
    gres: gpu:full:1  # haicore supports requesting fractions of a GPU, so this must be used to request a full GPU
    cpus_per_task: 38
