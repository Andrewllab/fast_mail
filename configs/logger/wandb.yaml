wandb:
  _target_: loggers.wandb.WandbLogger
  log_model: all  # all checkpoints are uploaded to wandb, even if only the last one is kept on disk
  exclude_override_keys: [data, preprocessing, obs_modality, obs_encoder, platform, debug]

  # passed to wandb.init()
  project: PAKT_Robocasa
  entity: nicolasschreiber
  job_type: ${oc.select:job_type,null}
  notes: null
  tags: null
  reinit: finish_previous  # required for hydra sweeps with default launcher
  save_code: True  # save script used to start training, git commit, and patch
