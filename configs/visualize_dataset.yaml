defaults:
  - data: one_leg_alr_metaquest2
  - agent: null_agent
  - callbacks: null
  - logger: null
  - python_logging: default
  - paths: default
  - hydra: default
  - experiment:
    - pointpatch_colorless
    # - render_cameras
    - render_pointcloud
  - _self_
  - platform: default
  - optional local: default
  - debug: verbose

# task name, determines output directory path
job_type: visualize_dataset

data:
  batch_size: 1
  eval_mode: dataset
  dataset:
    action_seq_len: 1
    load_subset: 0.05
  gpu_batch_transforms:
    1_to_pcd:
      color: True
    4_norm: null  # do not normalize when rendering
  num_workers: 0

trainer:
  accelerator: gpu
  devices: 1
  # precision: 16-true
  default_root_dir: ${paths.output_dir}
  enable_progress_bar: False

torch:
  set_float32_matmul_precision: medium
