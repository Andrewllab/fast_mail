defaults:
  - data: one_leg_alr_metaquest2
  - agent: null_agent
  - callbacks: null
  - logger: null
  - python_logging: default
  - paths: default
  - hydra: default
  - experiment: sim_pointclouds
  - transforms@agent.obs_encoder.t9_render: render_pointcloud
  - _self_
  - platform: default
  - optional local: default
  - debug: quick

# task name, determines output directory path
job_type: visualize_dataset

data:
  batch_size: 1  # required for visualization
  eval_mode: dataset
  dataset:
    action_seq_len: 1
    load_subset: 0.05
  gpu_batch_transforms:
    t1-3_to_pcd:
      color: True

agent:
  fps: 10

trainer:
  default_root_dir: ${paths.output_dir}
  enable_progress_bar: False
