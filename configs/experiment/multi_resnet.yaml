# @package _global_

defaults:
  # convert HWC to CHW, convert to float, and rescale
  - /transforms@data.dataset.transforms.1_toimage: to_torchimage
  # apply ImageNet normalization
  - /transforms@data.dataset.transforms.2_norm: imagenet_norm

  # tokenize the rgb images using a ResNet
  - /transforms@agent.obs_encoder.3_resnets: multi_resnets_tokenizer

agent:
  obs_encoder:
    embed_dim: 256
    
    3_resnets:
      share_rgb_model: False
    
      rgb_model:
        # resnet18
        pretrained_weights: null  # null or "IMAGENET1K_V1"
