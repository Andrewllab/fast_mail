# @package _global_

defaults:
  - /models/spatial_encoder@agent.obs_encoder.t10_image_tokenizer.spatial_encoder: conv_fourier_features

agent:
  obs_encoder:
    t10_image_tokenizer:
      spatial_encoder:
          n_wavelengths: ${n_wavelengths}
          max_wavelength: ${max_wavelength}
          min_wavelength: ${min_wavelength}
          cat_cartesian_coordinates: ${cat_cartesian_coordinates}

# interpolate from top-level config for ease of use on command line
n_wavelengths: 10
max_wavelength: 2
min_wavelength: 0.002
cat_cartesian_coordinates: True
