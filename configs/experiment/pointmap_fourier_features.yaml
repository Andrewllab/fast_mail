# @package _global_

defaults:
  - /models/spatial_encoder@agent.obs_encoder.t10_image_tokenizer.spatial_encoder: learnable_conv_ff

agent:
  obs_encoder:
    t10_image_tokenizer:
      spatial_encoder:
          n_wavelengths: ${n_wavelengths}
          cat_input_to_out: ${cat_input_to_out}

# interpolate from top-level config for ease of use on command line
n_wavelengths: 6
cat_input_to_out: True
