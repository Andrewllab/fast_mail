# @package _global_

defaults:
  # convert HWC to CHW, convert to float, and rescale
  - /transforms@data.dataset.transforms.1_toimage: to_torchimage
  # apply ImageNet normalization
  - /transforms@data.dataset.transforms.2_norm: imagenet_norm

  - override /data: libero
  - override /agent/obs_encoder/tokenizer: resnet

data:
  # set task here
  task: libero_object
