# @package _global_

defaults:
  # downsample the RGBD images to avoid excessive memory usage
  - /transforms@data.gpu_batch_transforms.t1-2_resize: image_resize

  - /transforms@data.gpu_batch_transforms.t1-3_to_pcd: to_pointcloud
  
  # - /transforms@data.gpu_batch_transforms.t2-1_crop: pointcloud_crop

  # - /transforms@data.gpu_batch_transforms.t2-2_remove_table: pointcloud_remove_plane

  # - /transforms@data.gpu_batch_transforms.t2-3_voxel_downsample: pointcloud_voxel_downsample

  # patch the pointcloud and tokenize the patches
  - /transforms@agent.obs_encoder.t5_tokenizer: pointpatchrl_tokenizer
  # add tokens for the robot state
  - /transforms@agent.obs_encoder.t6_robot_state: linear_robot_state_encoder

agent:
  obs_encoder:
    embed_dim: 256
data:
  batch_size: 4  # TODO: set as factor of platform.batch_size
  gpu_batch_transforms:
    t1-2_resize:
      shape: 64

logger:
  wandb:
    tags: ["pointcloud", "pointpatchrl"]
