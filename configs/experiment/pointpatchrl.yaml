# @package _global_

defaults:
  # downsample the RGBD images to avoid excessive memory usage
  - /transforms@data.gpu_batch_transforms.t1-2_resize: image_resize

  - /transforms@data.gpu_batch_transforms.t1-3_to_pcd: to_pointcloud
  
  - /transforms@data.gpu_batch_transforms.t2-1_crop: pointcloud_crop

  - /transforms@data.gpu_batch_transforms.t2-2_voxel_downsample: pointcloud_downsample_voxel

  # - /transforms@data.gpu_batch_transforms.t4_normalize: pointcloud_normalize

  # patch the pointcloud and tokenize the patches
  - /transforms@agent.obs_encoder.t5_tokenizer: pointpatchrl_tokenizer
  # add tokens for the robot state
  - /transforms@agent.obs_encoder.t6_robot_state: linear_robot_state_tokenizer

agent:
  obs_encoder:
    embed_dim: 256
    t5_tokenizer:
      patch_size: 16
      oversampling_ratio: 4.0
data:
  batch_size: ${floor_div:${platform.batch_size},4}  # 1/4 of typical batch size
  gpu_batch_transforms:
    t1-2_resize:
      shape: 128
    t2-1_crop:
      x_range: [0.1, 1.0]  # crop the robot base out of the observation
      y_range: [-0.4, 0.4]
      z_range: [0.007, 0.4]  # just high enough to remove the table
    t2-2_voxel_downsample:
      size: 0.006
  dataset:
    preprocessed_dir: ${paths.preprocessed_dir}/dataset_11.04.25/pointpatchrl # pointpatchrl_nosubsample
    # overwrite_preprocessed: True

logger:
  wandb:
    tags: ["pointcloud", "pointpatchrl"]
