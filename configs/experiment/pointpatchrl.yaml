# @package _global_

defaults:
  - sim_pointclouds

  # patch the pointcloud and tokenize the patches
  - /tokenizers@agent.obs_encoder.t5-1_patching: pointpatcher
  - /tokenizers@agent.obs_encoder.t5-2_tokenizer: pointpatchrl_tokenizer
  - /models/pos_projection@agent.obs_encoder.t5-2_tokenizer.pos_projection: nerf_pos_projection

  # add tokens for the robot state
  - /tokenizers@agent.obs_encoder.t6_robot_state: linear_robot_state_tokenizer

agent:
  obs_encoder:
    embed_dim: 256
    t5-1_patching:
      patch_size: 32
      oversampling_ratio: 4.0

data:
  batch_size: ${floor_div:${platform.batch_size},4}  # 1/4 of typical batch size

logger:
  wandb:
    tags: ["pointcloud", "pointpatchrl"]
