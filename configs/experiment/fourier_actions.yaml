# @package _global_

defaults:
  - override /agent/noise_model/action_head: fourier

agent:
  noise_model:
    action_head:
      n_wavelengths: ${n_wavelengths}
      max_wavelength: ${max_wavelength}
      min_wavelength: ${min_wavelength}
      n_encoded_actions: ${n_encoded_actions}

n_wavelengths: 10
max_wavelength: 16.0  # action range is half of longest wavelength
min_wavelength: ${pow:2,-5}  # 2^-5, ensures that wavelengths are powers of 2
n_encoded_actions: 3  # just the 3D position
