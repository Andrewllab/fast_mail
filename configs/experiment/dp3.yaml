# @package _global_

defaults:
  - sim_pointclouds

  - /tokenizers@agent.obs_encoder.t5_tokenizer: dp3_tokenizer
  
  # add tokens for the robot state
  - /tokenizers@agent.obs_encoder.t6_robot_state: linear_robot_state_tokenizer

agent:
  obs_encoder:
    embed_dim: 256

data:
  batch_size: ${floor_div:${platform.batch_size},4}  # 1/4 of typical batch size

logger:
  wandb:
    tags: ["pointcloud", "dp3"]
