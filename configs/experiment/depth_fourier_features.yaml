# @package _global_

defaults:
  - /models/spatial_encoder@agent.obs_encoder.t15_depth_tokenizer.spatial_encoder: conv_fourier_features

agent:
  obs_encoder:
    t15_depth_tokenizer:
      spatial_encoder:
        cartesian_dim: 1  # depth has 1 channel
        n_wavelengths: ${n_wavelengths}
        max_wavelength: ${max_wavelength}
        min_wavelength: ${min_wavelength}
        cat_cartesian_coordinates: ${cat_cartesian_coordinates}

# interpolate from top-level config for ease of use on command line
n_wavelengths: 4
max_wavelength: 4.0
min_wavelength: 0.1
cat_cartesian_coordinates: True
