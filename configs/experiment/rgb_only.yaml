# @package _global_

defaults:
  # pretrained resnet18 expects images resized to 256x256...
  - /transforms@data.preprocess_transforms.t1_resize: image_resize

  # ...and then cropped to 224x224
  - /transforms@data.preprocess_transforms.t2_crop: image_centercrop
  
  # apply ImageNet normalization
  - /transforms@data.gpu_batch_transforms.t4_norm: imagenet_norm

  # tokenize the rgb images using a ResNet
  - /transforms@agent.obs_encoder.t5_resnets: resnet_image_tokenizer
  # add tokens for the robot state
  - /transforms@agent.obs_encoder.t6_robot_state: linear_robot_state_tokenizer

agent:
  obs_encoder:
    embed_dim: 256
    
    t5_resnets:
      shared_encoder: False
    
      image_encoder:
        # resnet18
        pretrained_weights: IMAGENET1K_V1  # null or "IMAGENET1K_V1"
        freeze_backbone: False

data:
  dataset:
    preprocessed_dir: ${paths.preprocessed_dir}/dataset_11.04.25/multiview_image

logger:
  wandb:
    tags: ["rgb", "resnet18"]
