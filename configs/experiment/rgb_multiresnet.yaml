# @package _global_

defaults:
  # convert HWC to CHW, convert to float, and rescale
  - /transforms@data.gpu_batch_transforms.1_toimage: to_torchimage
  # apply ImageNet normalization
  - /transforms@data.gpu_batch_transforms.2_norm: imagenet_norm

  # tokenize the rgb images using a ResNet
  - /transforms@agent.obs_encoder.3_resnets: multi_resnets_tokenizer
  # add tokens for the robot state
  - /transforms@agent.obs_encoder.4_robot_state: linear_robot_state_encoder

agent:
  obs_encoder:
    embed_dim: 256
    
    3_resnets:
      share_rgb_model: False
    
      rgb_model:
        # resnet18
        pretrained_weights: null  # null or "IMAGENET1K_V1"

logger:
  wandb:
    tags: ["rgb", "rgb_multiresnet"]
