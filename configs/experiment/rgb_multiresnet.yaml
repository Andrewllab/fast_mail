# @package _global_

defaults:
  # convert HWC to CHW, convert to float, and rescale
  - /transforms@data.gpu_batch_transforms.1_toimage: to_torchimage
  # scale images down by a factor of 2
  - /transforms@data.gpu_batch_transforms.2_resize: resize_image
  # apply ImageNet normalization
  - /transforms@data.gpu_batch_transforms.3_norm: imagenet_norm

  # tokenize the rgb images using a ResNet
  - /transforms@agent.obs_encoder.4_resnets: multi_resnets_tokenizer
  # add tokens for the robot state
  - /transforms@agent.obs_encoder.5_robot_state: linear_robot_state_encoder

data:
  gpu_batch_transforms:
    2_resize:
      factor: 0.5

agent:
  obs_encoder:
    embed_dim: 256
    
    4_resnets:
      share_rgb_model: False
    
      rgb_model:
        # resnet18
        pretrained_weights: IMAGENET1K_V1  # null or "IMAGENET1K_V1"
        freeze_backbone: False
        use_group_norm: True

logger:
  wandb:
    tags: ["rgb", "rgb_multiresnet"]
