# @package _global_

defaults:
  # pretrained resnet18 expects images resized to 256x256...
  - /transforms@data.preprocess_transforms.1_resize: image_resize

  # ...and then cropped to 224x224
  - /transforms@data.preprocess_transforms.2_crop: image_centercrop
  
  # - /transforms@data.preprocess_transforms.3_subsample: time_subsample

  # apply ImageNet normalization
  - /transforms@data.gpu_batch_transforms.4_norm: imagenet_norm

  # tokenize the rgb images using a ResNet
  - /transforms@agent.obs_encoder.5_resnets: multi_resnets_tokenizer
  # add tokens for the robot state
  - /transforms@agent.obs_encoder.6_robot_state: linear_robot_state_encoder

agent:
  obs_encoder:
    embed_dim: 256
    
    5_resnets:
      share_rgb_model: False
    
      rgb_model:
        # resnet18
        pretrained_weights: IMAGENET1K_V1  # null or "IMAGENET1K_V1"
        freeze_backbone: False
        use_group_norm: True

data:
  dataset:
    preprocessed_dir: ${paths.preprocessed_dir}/dataset_11.04.25/rgb_multiresnet

logger:
  wandb:
    tags: ["rgb", "rgb_multiresnet"]
