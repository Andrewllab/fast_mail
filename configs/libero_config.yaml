defaults:
  - agents: bc_one_cam_agent
#  - override hydra/launcher: submitit_slurm

agent_name: bc_one_cam
log_dir: logs/${task_suite}/

# insert wandb here
wandb:
  entity: tiger_or_cat
  project: Mask_Pretrain

group: bc_${task_suite}

hydra:
  mode: MULTIRUN  # needed for launcher to be used
  run:
    dir: ${log_dir}/runs/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: True
  sweep:
    dir: ${log_dir}/sweeps/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
#  launcher:
#    account: hk-project-sustainebot
#    timeout_min: 500
#    name: libero #${hydra.job.name}
#    partition: accelerated
#    #    gpus_per_node: 4
#    gres: gpu:1
##    cpus-per-task: 152
##    additional_parameters: { "ntasks": 1, "gres": gpu:4, "cpus-per-task": 152 }

seed: 42

task_suite: libero_spatial

# dataset config
traj_per_task: 10


## change the path of dataset
dataset_path: /home/i53/student/boli/mask_pretrain/dataset/${task_suite}
#dataset_path: /hkfs/work/workspace/scratch/ll6323-david_dataset/data/libero/${task_suite}
mask_dataset_path: /home/i53/student/boli/detic/Detic/segmentation/videos/${task_suite}

# encoder-decoder
encoder_n_layer: 4
decoder_n_layer: 6
n_embd: 256
goal_dim: 512
latent_dim: 256

# Model Setting
window_size: 10
obs_seq_len: 1
act_seq_len: ${window_size}
goal_window_size: 1

# Training
train_batch_size: 256
val_batch_size: 32
num_workers: 4
device: 'cuda'
epoch: 100
eval_every_n_epochs: 1
scale_data: True
scaler_type: 'standard'

## Environment
obs_dim: 9
action_dim: 7
state_dim: 110
max_len_data: 260

# simulation
start_cpu: 0
render: False
n_cores: 1
episode_per_task: 25
max_step_per_episode: 260
camera_shape: [ 128, 128 ]

obs_keys: rgb
dataset_keys:
  - actions
  - dones
  - obs
  - rewards
  - states
hdf5_filter_key: # train
hdf5_validation_filter_key: # valid
enable_valid: True
observation:
  modalities: &obs_modalities_list
    obs:
      low_dim:
        - ee_ori
        - ee_pos
        - gripper_states
        - joint_states
      rgb:
        - agentview_rgb
        - eye_in_hand_rgb
      depth: []
      scan: []
    goal:
      low_dim: []
      rgb: []
      depth: []
      scan: []

# Dataset
trainset:
  _target_: environments.dataset.libero_dataset_benchmark.LiberoDataset
  data_directory: ${dataset_path}
  obs_keys: ${obs_keys}
  obs_modalities: *obs_modalities_list
  dataset_keys: ${dataset_keys}
  filter_by_attribute: ${hdf5_filter_key}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  state_dim: ${state_dim}
  max_len_data: ${max_len_data}
  window_size: ${window_size}
  traj_per_task: ${traj_per_task}
  data_aug: False

valset:
  _target_: environments.dataset.libero_dataset_benchmark.LiberoDataset
  data_directory: ${dataset_path}
  obs_keys: ${obs_keys}
  obs_modalities: *obs_modalities_list
  dataset_keys: ${dataset_keys}
  filter_by_attribute: ${hdf5_validation_filter_key}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  state_dim: ${state_dim}
  max_len_data: ${max_len_data}
  window_size: ${window_size}
  start_idx: 30

## all_data_dir is folder path of libero dataset
## folder is a path for original images and masked images
Maskdataset:
  _target_: environments.dataset.libero_mask_dataset.ImagesDataset
  folder: ${mask_dataset_path}
  all_data_dir: ${dataset_path}
  task_suite: ${task_suite}

simulation:
  _target_: simulation.libero_sim.MultiTaskSim
  _convert_: all
  task_suite: ${task_suite}
  use_eye_in_hand: False
  seed: ${seed}
  device: ${device}
  render: True
  n_cores: ${n_cores}
  num_episode: 20
  max_step_per_episode: 600