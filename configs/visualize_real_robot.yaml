defaults:
  - data: real_robot
  - /cameras/calibration@data.env.env.cameras: 2025-09-16
  - agent: null_agent
  - callbacks:
  - logger:
  - python_logging: default
  - paths: default
  - hydra: default
  - obs_modality: real_pointclouds
  - transforms@data.gpu_batch_transforms.t90_render_pcd: render_pointcloud
  - transforms@data.gpu_batch_transforms.t90_render_diff: render_image_diff
  - _self_
  - platform: default
  - optional local: default
  - debug: verbose

# task name, determines output directory path
job_type: visualize_real_robot

data:
  eval_mode: env
  batch_size: 1  # required for visualization

  env:
    human_control: True  # allow the robot to move freely
    action_horizon: 1  # required
  
  preprocess:
    t15_to_pcd:
      color: True  # add colors to pointclouds, in case we render pointclouds

    # don't remove any data streams, so we can visualize them
    t1_drop: null
    t99_cleanup: null

  gpu_batch_transforms:
    t90_render:
      stream_names: [rgb, depth]

    t90_render_pcd:
      render_camera_poses: False
      render_ee_pose: False
      render_action: False

trainer:
  default_root_dir: ${paths.output_dir}
  enable_progress_bar: False
