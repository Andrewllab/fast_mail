# @package _global_

defaults:
  # Trim idle time steps throughout the demonstration
  - /transforms@data.preprocess.t1_trim_idle: time_trim_idle_real

data:
  preprocess:
    # Convert gripper actions from width of leader robot to binary open/close
    t0_gripper_actions:
      _target_: transforms.action_binarize_gripper.BinarizeGripperActions
      _partial_: True
      threshold: null  # use half the max gripper width as threshold
      hysteris_steps: 30  # issue a warning if state changes happen more frequently than this 
