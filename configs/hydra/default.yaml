# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output directory, generated dynamically on each run
run:
  dir: ${paths.log_dir}/${job_type}_runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
sweep:
  dir: ${paths.log_dir}/${job_type}_sweeps/${now:%Y-%m-%d}/${now:%H-%M-%S}
  subdir: ${hydra.job.override_dirname}
job:
  config:
    override_dirname:
      kv_sep: "-"
      item_sep: _
      exclude_keys: [data,obs_modality,obs_encoder,platform,debug]

job_logging:
  handlers:
    file:
      # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
      filename: ${hydra:runtime.output_dir}/${hydra:job.config_name}.log
