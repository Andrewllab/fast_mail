# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output directory, generated dynamically on each run
# BALAZS: update these paths (copied from David)
run:
  dir: ${paths.log_dir}/${task_suite}/runs/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
sweep:
  dir: ${paths.log_dir}/${task_suite}/sweeps/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  subdir: ${hydra.job.override_dirname}
job:
  config:
    override_dirname:
      item_sep: _

job_logging:
  handlers:
    file:
      # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
      filename: ${hydra.runtime.output_dir}/${agent_name}.log
