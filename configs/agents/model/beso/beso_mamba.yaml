_target_: agents.models.beso.models.edm_diffusion.score_wrappers.GCDenoiser
_recursive_: false

sigma_data: 0.5

inner_model:
  _target_: agents.models.beso.models.networks.mdt_transformer.MDTTransformer
  action_dim: ${action_dim}
  obs_dim: ${latent_dim}
  goal_dim: ${goal_dim}
  proprio_dim: 8
  goal_conditioned: False
  embed_dim: ${latent_dim}
  n_dec_layers: 6
  n_enc_layers: 4
  goal_seq_len: ${goal_window_size}
  obs_seq_len: 4 #4 camers ${obs_seq_len}
  action_seq_len: ${act_seq_len}
  embed_pdrob: 0
  goal_drop: 0
  attn_pdrop: 0.3
  resid_pdrop: 0.1
  mlp_pdrop: 0.05
  # Architecture details
  n_heads: 8
  device: ${device}
  linear_output: True
  use_rot_embed: False
  use_abs_pos_emb: True
  bias: false
  use_ada_conditioning: True
  use_noise_encoder: False # only relevant for ada_conditioning
  use_modality_encoder: True
  use_mlp_goal: False