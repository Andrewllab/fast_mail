_target_: agents.models.bc.bc.BC_Policy
_recursive_: false

backbones:
  _target_: agents.backbones.encoder_decoder.EncDec
  _recursive_: false
  state_dim: ${latent_dim}
  action_dim: ${action_dim}
  goal_conditioned: ${goal_conditioned}
  goal_seq_len: 1
  obs_seq_len: ${obs_tokens}
  action_seq_len: ${act_seq_len}
  embed_pdrob: 0
  # Architecture details
  embed_dim: ${n_embd}
  goal_dim: ${goal_dim}
  device: ${device}
  linear_output: true

  encoder:
    _target_: agents.backbones.transformer.transformer.TransformerEncoder
    embed_dim: ${n_embd}
    n_heads: ${n_heads}
    n_layers: ${encoder_n_layer}
    attn_pdrop: 0.1
    resid_pdrop: 0.1
    bias: False
    block_size: ${add:${window_size}, 5}

  decoder:
    _target_: agents.backbones.transformer.transformer.TransformerDecoder
    embed_dim: ${n_embd}
    cross_embed: ${n_embd} # allow cross embedding to have different dimension
    n_heads: ${n_heads}
    n_layers: ${decoder_n_layer}
    attn_pdrop: 0.1
    resid_pdrop: 0.1
    bias: False
    block_size: ${add:${window_size}, 5}

device: ${device}

