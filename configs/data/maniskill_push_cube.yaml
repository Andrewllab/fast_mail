defaults:
  - maniskill

task: push_cube
name: maniskill_push_cube

action_seq_len: 10
obs_seq_len: 1

dataset:
  _target_: environments.datasets.maniskill_group1_dataset.ManiSkillDataset
  root_dir: ${paths.data_dir}/maniskill/PushCube-v1_joint_delta_pos

env:
  env:
    env_id: PushCube-v1
    control_mode: pd_joint_delta_pos
    sim_backend: physx_cuda
    sensor_configs:
      base_camera:
        width: 256
        height: 256
