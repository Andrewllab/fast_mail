defaults:
  - default
  - env: record_video

task_suite: robocasa

action_seq_len: 20
obs_seq_len: 1

dataset:
  _target_: environments.robocasa.robocasa_dataset.RoboCasaDataset
  load_subset: null
  subfolders: null

env:
  _target_: environments.robocasa.build_env.make 
  env_name: ???
  img_height: 224  # observation image height
  img_width: 224  # observation image width
  render_cam_name: robot0_agentview_left  # camera to use for rendering videos
  render_size: [256, 256]  # resolution to use for rendering videos, if different from observation resolution

  num_envs: 1
  parallel: null  # if null, parallelization is determined based on num_envs > 1
  action_horizon: null  # use all predicted actions
  obs_seq_len: ${data.obs_seq_len}
  max_episode_steps:
    OpenDoubleDoor: 800
    CloseDoubleDoor: 800
    default: 400

  num_episodes: 20  # evaluate on 20 episodes
