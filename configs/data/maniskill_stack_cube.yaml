defaults:
  - maniskill

task: stack_cube
name: maniskill_stack_cube

action_seq_len: 10
obs_seq_len: 1

dataset:
  _target_: environments.datasets.maniskill_group2_dataset_joint_pos.ManiSkillDataset
  root_dir: ${paths.data_dir}/maniskill/StackCube-v1_joint_delta_pos

env:
  env:
    env_id: StackCube-v1
    control_mode: pd_joint_delta_pos
    sim_backend: physx_cuda
    sensor_configs:
      base_camera:
        width: 256
        height: 256
      hand_camera:
        width: 256
        height: 256
