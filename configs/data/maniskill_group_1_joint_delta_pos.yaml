defaults:
  - default
  - maniskill

task_suite: manskill
task: group_1
name: maniskill_group_1

dataset:
  _target_: environments.datasets.maniskill_group1_dataset_joint_pos.ManiSkillDataset
  _partial_: True  # requires transforms at runtime
  root_dir: ${paths.data_dir}/maniskill/group1_joint_delta_pos
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 5
  obs_seq_len: 1

env_dataset:
  env:
    env_id: LiftPegUpright-v1 # LiftPegUpright-v1, PokeCube-v1, PullCube-v1
    sim_backend: physx_cuda
    control_mode: pd_joint_delta_pos
    sensor_configs:
      base_camera:
        width: 256
        height: 256


device: cpu  # this dataset is maybe small enough to fit in memory