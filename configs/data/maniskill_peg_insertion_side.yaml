defaults:
  - default
  - maniskill

task_suite: maniskill
task: peg_insertion_side
name: maniskill_peg_insertion_side

dataset:
  _target_: environments.datasets.maniskill_group2_dataset.ManiSkillDataset
  _partial_: True  # requires transforms at runtime
  root_dir: ${paths.data_dir}/maniskill/PegInsertionSide-v1
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 30
  obs_seq_len: 1

env_dataset:
  env:
    env_id: PegInsertionSide-v1
    sensor_configs:
      base_camera:
        width: 256
        height: 256
      hand_camera:
        width: 256
        height: 256


device: cpu  # this dataset is maybe small enough to fit in memory