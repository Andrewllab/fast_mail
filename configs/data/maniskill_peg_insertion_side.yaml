defaults:
  - maniskill

task: peg_insertion_side
name: maniskill_peg_insertion_side

action_seq_len: 30
obs_seq_len: 1

dataset:
  _target_: environments.datasets.maniskill_group2_dataset_joint_pos.ManiSkillDataset
  root_dir: ${paths.data_dir}/maniskill/PegInsertionSide-v1_joint_pos

env:
  env:
    env_id: PegInsertionSide-v1
    control_mode: pd_joint_pos
    sim_backend: physx_cpu
    sensor_configs:
      base_camera:
        width: 256
        height: 256
      hand_camera:
        width: 256
        height: 256
