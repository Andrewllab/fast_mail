# recorded with real robot at 30fps

defaults:
  - insert_screw_alr_20250817
  - default

dataset:
  root_dir: ${paths.data_dir}/insert_one_leg/real_world_teleoperation/insert_screw_2025-08-17_fs_224x224
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base

preprocess_transforms:
  t3-1_triangle_crop:
    _target_: transforms.triangle_crop.TriangleCrop
    _partial_: true
    borders:
      front_left_cam:
        mask_right: true
        point1: [223, 155]
        point2: [155, 223]
      front_right_cam:
        mask_right: true
        point1: [190, 0]
        point2: [223, 30]
