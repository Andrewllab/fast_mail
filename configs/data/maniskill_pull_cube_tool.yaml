defaults:
  - default
  - maniskill

task_suite: maniskill
task: pull_cube_tool
name: maniskill_pull_cube_tool

dataset:
  _target_: environments.datasets.maniskill_group1_dataset.ManiSkillDataset
  _partial_: True  # requires transforms at runtime
  root_dir: ${paths.data_dir}/maniskill/PullCubeTool-v1
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 30
  obs_seq_len: 1

env_dataset:
  env:
    env_id: PullCubeTool-v1
    control_mode: pd_joint_delta_pos
    sim_backend: physx_cuda
    sensor_configs:
      base_camera:
        width: 256
        height: 256

device: cpu  # this dataset is maybe small enough to fit in memory