# recorded with real robot at 30fps

defaults:
  - default
  - /transforms@preprocess_transforms.t0-1_trim_idle: time_trim_idle
  - /transforms@preprocess_transforms.t0-3_relative_actions: action_abs_to_relative_chunk
  - /transforms@preprocess_transforms.t0-4_normalize_actions: action_norm_max
  - /cameras/calibration@dataset.extrinsics: 2025-08-31

task_suite: furniture_bench
task: insert_one_leg
name: insert_screw_20250817

dataset:
  _target_: environments.datasets.insert_screw_real_robot_v1.RealRobotDataset
  _partial_: True
  root_dir: ${paths.data_dir}/insert_one_leg/real_world_teleoperation/insert_screw_2025-08-17
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 60
  obs_seq_len: 1
  gpu_preprocess_batch_size: ${platform.fs_preprocess_batch_size}  # TODO: move inside transform

preprocess_transforms:
  t0-3_relative_actions:
    reference: current_ee_pose

  t1-3_triangle_crop:
    _target_: transforms.triangle_crop.TriangleCrop
    _partial_: true
    borders:
      front_left_cam:
        mask_right: true
        point1: [449, 439]
        point2: [337, 580]
      front_right_cam:
        mask_right: true
        point1: [339, 45]
        point2: [437, 105]

device: cpu  # this dataset is maybe small enough to fit in memory
