# recorded with real robot at 30fps

defaults:
  - default

  - /transforms@preprocess_transforms.t0-1_trim_idle: time_trim_idle

  # We express rotations as quaternions. Predicted quaternions are normalized to unit length
  - /transforms@preprocess_transforms.t0-4_quaternions: rotations_quaternions

  # - /transforms@preprocess_transforms.t0-5_relative_actions: action_abs_to_relative_chunk

  # normalize absolute actions so that they lie within [-1,1]
  - /transforms@preprocess_transforms.t0-9_normalize_actions: action_norm_minmax

  - /cameras/calibration@dataset.extrinsics: 2025-08-31

task_suite: furniture_bench
task: insert_one_leg
name: insert_screw_20250817

dataset:
  _target_: environments.datasets.insert_screw_real_robot_v1.RealRobotDataset
  _partial_: True
  root_dir: ${paths.data_dir}/insert_one_leg/real_world_teleoperation/insert_screw_2025-08-17_fs_224x224
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 60
  obs_seq_len: 1
  gpu_preprocess_batch_size: ${platform.fs_preprocess_batch_size}  # TODO: move inside transform

preprocess_transforms:
  t0-5_relative_actions:
    reference: current_ee_pose

device: cpu  # this dataset is maybe small enough to fit in memory
