# recorded with real robot at 30fps

defaults:
  - default

task_suite: furniture_bench
task: insert_screw
name: insert_screw_20250817

dataset:
  _target_: environments.datasets.insert_screw_real_robot_v1.RealRobotDataset
  _partial_: True
  root_dir: ${paths.data_dir}/insert_one_leg/real_world_teleoperation/insert_screw_2025-08-17
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 30
  obs_seq_len: 1

preprocess_transforms:
  t0-2_subsample:
    factor: 3 # Subsample to 10hz
  t0-3_relative_actions:
    reference: current_ee_pose

device: cpu  # this dataset is maybe small enough to fit in memory
