# recorded with rate limit 30fps, sim_dt = 1 / 120, decimation = 4

defaults:
  - default
  - isaac
  # trim idle frames from the start of each demonstration
  - /transforms@preprocess_transforms.t0-1_trim_idle: time_trim_idle
  # # since this dataset was recorded at ~20 fps, subsample by a factor of 2
  # - /transforms@preprocess_transforms.t0-2_subsample: time_subsample
  
  # We express rotations as quaternions. Predicted quaternions are normalized to unit length
  - /transforms@preprocess_transforms.t0-4_quaternions: rotations_quaternions

  # # convert actions to chunks of absolute target poses relative to the current frame
  # - /transforms@preprocess_transforms.t0-5_relative_actions: action_abs_to_relative_chunk
  # # normalize relative actions so that the max magnitude of each action dimension is 1.0
  # - /transforms@preprocess_transforms.t0-9_normalize_actions: action_norm_max
  
  # normalize absolute actions so that they lie within [-1,1]
  - /transforms@preprocess_transforms.t0-9_normalize_actions: action_norm_minmax

task_suite: furniture_bench
task: one_leg
name: metaquest3_2025-07-24

dataset:
  _target_: environments.datasets.furniture_bench_alr_v3.AlrFurnitureBenchDataset
  _partial_: True  # requires transforms at runtime
  root_dir: ${paths.data_dir}/insert_one_leg/isaac_sim/metaquest3_2025-07-24_224x224
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 60  # Jan says 60 works well
  obs_seq_len: 1

preprocess_transforms:
  t0-2_subsample:
    factor: 2
  t0-5_relative_actions:
    reference: current_ee_pose

device: cpu  # this dataset is maybe small enough to fit in memory
