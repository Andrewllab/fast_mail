defaults:
  - default
  - maniskill

task_suite: maniskill
task: group_2
name: maniskill_group_2

dataset:
  _target_: environments.datasets.maniskill_group2_dataset.ManiSkillDataset # contains hand camera
  _partial_: True  # requires transforms at runtime
  root_dir: ${paths.data_dir}/maniskill/group2
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 30 # actions are longer (motionplanned)
  obs_seq_len: 1

env_dataset:
  env:
    env_id: StackCube-v1 # PegInsertionSide-v1, PlugCharger-v1, StackCube-v1
    sensor_configs:
      base_camera:
        width: 256
        height: 256
      hand_camera:
        width: 256
        height: 256


device: cpu  # this dataset is maybe small enough to fit in memory