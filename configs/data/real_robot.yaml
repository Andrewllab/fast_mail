defaults:
  - env
  - /cameras@env_dataset.env.cameras.left_cam: zed_mini_15544393
  - /cameras@env_dataset.env.cameras.right_cam: zed_mini_11185595
  - /cameras@env_dataset.env.cameras.gripper_cam: realsense_d405_218622270040
  - /cameras/calibration@env_dataset.env.cameras: old
  - /robot@env_dataset.env.robot: panda4
  - _self_

env_dataset:
  env:
    _target_: environments.real_robot.real_robot_env.make_env
    control_type: hybrid_joint
    cameras:
      left_cam:
        name: left_cam
      right_cam:
        name: right_cam
      gripper_cam:
        name: gripper_cam
  action_horizon: 5
  fps: 5  # inference should probably be around 10fps on the real robot
