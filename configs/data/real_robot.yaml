defaults:
  - /cameras@env_dataset.env.cameras.left_cam: zed_mini_17008863
  - /cameras@env_dataset.env.cameras.right_cam: zed_mini_16055244
  - /cameras@env_dataset.env.cameras.gripper_cam: realsense_d405_218622270040
  - /cameras/calibration@env_dataset.env.cameras: 2025-08-31
  - /robot@env_dataset.env.robot: panda4
  - _self_

env_dataset:
  _target_: environments.gym_env_dataset.GymEnvDataset
  env:
    _target_: environments.real_robot.real_robot_env.make_env
    control_type: hybrid_joint
    cameras:
      left_cam:
        name: left_cam
      right_cam:
        name: right_cam
      gripper_cam:
        name: gripper_cam
    robot:
      home_pose: [  # joint positions
        0.005649,
        -0.099542,
        -0.118758,
        -2.201725,
        -0.009681,
        2.159746,
        -0.908100,
      ]
  num_episodes: null  # run infinitely, although the real env has no timeout anyway
  action_horizon: 5
  fps: 5  # inference should probably be around 10fps on the real robot
