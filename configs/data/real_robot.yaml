defaults:
  - /cameras@env.env.cameras.front_left_cam: zed_mini_17008863
  - /cameras@env.env.cameras.front_right_cam: zed_mini_16055244
  - /cameras@env.env.cameras.gripper_cam: realsense_d405_218622270040
  - /robot@env.env.robot: panda4
  - _self_

task_suite: real
name: real_robot

# defaults
action_seq_len: 30
obs_seq_len: 1

env:
  _target_: environments.real_robot.build_env.make
  action_type: joint
  impedance_type: hybrid_joint
  cameras:
    front_left_cam:
      name: front_left_cam
      extrinsics: ${oc.select:data.dataset.extrinsics.front_left_cam.extrinsics,null}
    front_right_cam:
      name: front_right_cam
      extrinsics: ${oc.select:data.dataset.extrinsics.front_right_cam.extrinsics,null}
    gripper_cam:
      name: gripper_cam
      extrinsics: ${oc.select:data.dataset.extrinsics.gripper_cam.extrinsics,null}
  robot:
    home_pose: [  # joint positions
      0.005649,
      -0.099542,
      -0.118758,
      -2.201725,
      -0.009681,
      2.159746,
      -0.908100,
    ]
    reset_duration: 5.0
  fps: 10  # inference should probably be around 10fps on the real robot
  
  action_horizon: null  # use all predicted actions
  obs_seq_len: ${data.obs_seq_len}

  num_episodes: null  # run infinitely, although the real env has no timeout anyway
