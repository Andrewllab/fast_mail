defaults:
  - default
  - maniskill

task_suite: maniskill
task: roll_ball
name: maniskill_roll_ball

dataset:
  _target_: environments.datasets.maniskill_group1_dataset_joint_pos.ManiSkillDataset
  _partial_: True  # requires transforms at runtime
  root_dir: ${paths.data_dir}/maniskill/RollBall-v1_joint_delta_pos
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 10
  obs_seq_len: 1

env_dataset:
  env:
    env_id: RollBall-v1
    control_mode: pd_joint_delta_pos
    sensor_configs:
      base_camera:
        width: 256
        height: 256

device: cpu  # this dataset is maybe small enough to fit in memory