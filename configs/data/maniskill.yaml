defaults:
  - default

task_suite: maniskill

obs_seq_len: 1

env:
  env:
    _target_: environments.maniskill.build_env.make
    _recursive_: False  # don't try to import any targets for wrappers, in case IsaacLab is not installed
    env_id: null  # placeholder
    num_envs: 1
    obs_mode: rgbd  # 'state', 'pointcloud'
    render_mode: all
    wrappers:
      preprocess:
        _target_: environments.maniskill.wrappers.ManiSkillPreProcess
        _partial_: True  # requires 'env' argument
        obs_seq_len: ${data.obs_seq_len}

  num_envs: ${.env.num_envs}
  num_episodes: 20  # evaluate on 20 episodes
  action_horizon: null  # use all predicted actions
  fps: null  # run as fast as the simulation can manage
