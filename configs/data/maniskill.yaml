defaults:
  - default
  - env: record_video

task_suite: maniskill

obs_seq_len: 1

env:
  # maniskill-specific settings
  _target_: environments.maniskill.build_env.make
  env_id: ???
  sim_backend: physx_cuda  # may be overwritten by data config, must match the backend used for generating demonstration data
  obs_mode: state_dict+rgb+depth  # `state_dict` ensures that obs/extra also contains goal_pos if it exists
  control_mode: ???  # 'pd_joint_pos', 'pd_joint_delta_pos', 'pd_joint_vel', 'pd_torque'
  reconfigure_on_reset: False  # whether to reconfigure the env on each reset
  render_mode: rgb_array  # "rgb_array" for human view perspective, "sensors" for agent perspective, "all" for both
  
  # common settings
  num_envs: 1
  action_horizon: null  # use all predicted actions
  obs_seq_len: ${data.obs_seq_len}
  max_episode_steps: null  # use the default max episode steps for each environment
  
  num_episodes: 50  # evaluate on 50 episodes
