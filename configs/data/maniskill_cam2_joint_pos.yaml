defaults:
  - default
  - maniskill

task_suite: manskill
task: 2cam_group
name: maniskill_2cam_group

dataset:
  _target_: environments.datasets.maniskill_group2_dataset_joint_pos.ManiSkillDataset # contains hand camera
  _partial_: True  # requires transforms at runtime
  root_dir: ${paths.data_dir}/maniskill/maniskill_2cam_joint_pos
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 30 # actions are longer (motionplanned)
  obs_seq_len: 1

env_dataset:
  env:
    env_id: PegInsertionSide-v1 # PegInsertionSide-v1, PlugCharger-v1
    sim_backend: physx_cpu
    control_mode: pd_joint_pos
    sensor_configs:
      base_camera:
        width: 256
        height: 256
      hand_camera:
        width: 256
        height: 256


device: cpu  # this dataset is maybe small enough to fit in memory