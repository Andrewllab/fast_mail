# recorded with real robot at 30fps
defaults:
  - default
  - real_robot
  - /transforms@preprocess_transforms.t0-4_center_crop: image_centercrop

task_suite: furniture_bench
task: insert_screw
name: real_robot_teleop_20250824

dataset:
  _target_: environments.datasets.insert_screw_real_robot_v1.AlrFurnitureBenchDataset
  _partial_: True
  root_dir: ${paths.data_dir}/insert_one_leg/real_world_teleoperation/screw_insert_2025-08-17
  preprocessed_dir: ${paths.preprocessed_dir}/${..name}/base
  action_seq_len: 30
  obs_seq_len: 1

preprocess_transforms:
  t0-2_subsample:
    factor: 3 # Subsample to 10hz
  t0-3_relative_actions:
    reference: current_ee_pose
  t0-4_center_crop: # gripper cam has different resolution than the rest. Resize to same format
    shape:
      - 480
      - 640

device: cpu  # this dataset is maybe small enough to fit in memory