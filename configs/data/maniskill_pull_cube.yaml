defaults:
  - maniskill

task: pull_cube
name: maniskill_pull_cube

action_seq_len: 10
obs_seq_len: 1

dataset:
  _target_: environments.datasets.maniskill_group1_dataset_joint_pos.ManiSkillDataset
  root_dir: ${paths.data_dir}/maniskill/PullCube-v1_joint_delta_pos

env:
  env:
    env_id: PullCube-v1
    control_mode: pd_joint_delta_pos
    sim_backend: physx_cuda
    sensor_configs:
      base_camera:
        width: 256
        height: 256
