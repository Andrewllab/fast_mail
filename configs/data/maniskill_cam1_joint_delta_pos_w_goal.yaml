defaults:
  - maniskill

task: cam1_group_goal
name: maniskill_cam1_group_goal

action_seq_len: 10
obs_seq_len: 1

dataset:
  _target_: environments.datasets.maniskill_cam1_joint_goal_region.ManiSkillDataset
  root_dir: ${paths.data_dir}/maniskill/maniskill_1cam_joint_delta_pos_no_color

env:
  env:
    env_id: PokeCube-v1 # PokeCube-v1, PushCube-v1, PullCube-v1, RollBall-v1
    sim_backend: physx_cuda
    control_mode: pd_joint_delta_pos
    sensor_configs:
      base_camera:
        width: 256
        height: 256
