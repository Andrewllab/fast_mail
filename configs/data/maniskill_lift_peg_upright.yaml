defaults:
  - maniskill

task: lift_peg_upright
name: maniskill_lift_peg_upright

action_seq_len: 10
obs_seq_len: 1

dataset:
  _target_: environments.datasets.maniskill_group1_dataset_joint_pos.ManiSkillDataset
  root_dir: ${paths.data_dir}/maniskill/LiftPegUpright-v1_joint_delta_pos

env:
  env:
    env_id: LiftPegUpright-v1
    control_mode: pd_joint_delta_pos
    sensor_configs:
      base_camera:
        width: 256
        height: 256
