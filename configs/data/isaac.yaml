env_dataset:
  _target_: environments.gym_env_dataset.GymEnvDataset
  env:
    _target_: environments.simulation.utils.build_env.make
    _recursive_: False  # don't try to import any targets for wrappers, in case IsaacLab is not installed
    task_name: Isaac-Insert-One-Leg-Franka-RGBD-SingleFallen-IK-Abs-v0
    device: cuda
    num_envs: 1
    render_mode: rgb_array
    cli_args:
      # always enable cameras, no effect if there are no cameras objects in the environment config
      enable_cameras: True
      # run Isaac-Sim with GUI
      headless: False
    env_cfg:
      episode_length_s: 10
      # episode_length_steps: 300  # 10 seconds at render rate of 30 fps
    wrappers:
      gym_compatibility:
        _target_: environments.simulation.utils.wrappers.IsaacLabGymWrapper
        _partial_: True  # requires 'env' argument
      preprocess:
        _target_: environments.simulation.utils.wrappers.IsaacLabPreProcess
        _partial_: True  # requires 'env' argument
        obs_seq_len: 1

  num_envs: ${.env.num_envs}
  num_episodes: 20  # evaluate on 20 episodes
  action_horizon: null  # use all predicted actions
  fps: null  # run as fast as IsaacSim can manage
