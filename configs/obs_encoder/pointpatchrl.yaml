# @package _global_

defaults:
  # patch the pointcloud and tokenize the patches
  - /tokenizers@agent.obs_encoder.t10_patching: pointpatcher
  - /tokenizers@agent.obs_encoder.t11_tokenizer: pointpatchrl_tokenizer
  - /models/spatial_encoder@agent.obs_encoder.t11_tokenizer.spatial_encoder: fourier_features

  # add tokens for the robot state
  - /tokenizers@agent.obs_encoder.t20_robot_state: linear_robot_state_tokenizer

# Below is just the default configuration copied here for convenience. Change as needed.
agent:
  obs_encoder:
    embed_dim: 256
    t10_patching:
      patch_size: 64
      oversampling_ratio: 4.0
    t11_tokenizer:
      mlp_1:
        hidden_sizes: [128]
        out_features: 256
        activation: ReLU
      mlp_2:
        hidden_sizes: [512]
        activation: ReLU
      spatial_encoder:
        n_wavelengths: 10
        max_wavelength: 4.0
        min_wavelength: 0.06
        cat_cartesian_coordinates: False

data:
  batch_size: ${floor_div:${platform.batch_size},4}  # 1/4 of typical batch size

logger:
  wandb:
    tags: ["pointcloud", "pointpatchrl"]
