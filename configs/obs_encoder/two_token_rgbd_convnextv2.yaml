# @package _global_

defaults:
  # tokenize the rgb and depth images seperatly using two ConvNeXtv2s
  - /tokenizers@agent.obs_encoder.t10-1_image_tokenizer: image_tokenizer
  - /tokenizers@agent.obs_encoder.t10-2_image_tokenizer: image_tokenizer
  - override /models/vision_encoder@agent.obs_encoder.t10-1_image_tokenizer.image_encoder: timm_convnextv2
  - override /models/vision_encoder@agent.obs_encoder.t10-2_image_tokenizer.image_encoder: timm_convnextv2

agent:
  obs_encoder:
    embed_dim: 256
    
    t10-1_image_tokenizer:
      shared_encoder: True
      image_type: rgb
      image_encoder:
        pretrained: True

    t10-2_image_tokenizer:
      shared_encoder: True
      image_type: depth
      image_encoder:
        pretrained: False

data:
  batch_size: ${floor_div:${platform.batch_size},2}  # 1/2 of typical batch size

logger:
  wandb:
    tags: ["rgbd", "convnextv2"]
