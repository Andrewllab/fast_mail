# @package _global_

# defaults:
  # pointpatchrl tokenizer for pointclouds
  # - /tokenizers@agent.obs_encoder.t11_tokenizer: pakt_tokenizer

agent:
  obs_encoder:
    embed_dim: 256

data:
  batch_size: ${floor_div:${platform.batch_size},4}  # 1/4 of typical batch size

logger:
  wandb:
    tags: []

# metadata
encoder: PointPatch+ConvNeXtV2
has_fourier: True
