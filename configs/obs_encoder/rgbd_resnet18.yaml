# @package _global_

defaults:
  # tokenize the rgb images using a ResNet
  - /tokenizers@agent.obs_encoder.t10_image_tokenizer: image_tokenizer

agent:
  obs_encoder:
    embed_dim: 256
    
    t10_image_tokenizer:
      shared_encoder: False
      image_type: rgbd

data:
  batch_size: ${floor_div:${platform.batch_size},2}  # 1/2 of typical batch size

logger:
  wandb:
    tags: ["rgbd", "resnet18"]
