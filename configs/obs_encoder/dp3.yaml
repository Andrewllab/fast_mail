# @package _global_

defaults:
  - /tokenizers@agent.obs_encoder.t10_tokenizer: dp3_tokenizer
  - /models/spatial_encoder@agent.obs_encoder.t10_tokenizer.spatial_encoder: fourier_features
  
# Below is just the default configuration copied here for convenience. Change as needed.
agent:
  obs_encoder:
    embed_dim: 256
    t10_tokenizer:
      mlp_1:
        hidden_sizes: [64, 128]
        out_features: 256
        activation: ReLU
        norm: LayerNorm
      spatial_encoder:
        n_wavelengths: 8
        max_wavelength: 4.0
        min_wavelength: 0.06
        cat_cartesian_coordinates: False

data:
  batch_size: ${floor_div:${platform.batch_size},8}  # 1/8 of typical batch size

logger:
  wandb:
    tags: ["pointcloud", "dp3"]
