# @package _global_

defaults:
  - /tokenizers@agent.obs_encoder.t10_tokenizer: dp3_tokenizer
  - /models/pos_projection@agent.obs_encoder.t10_tokenizer.pos_projection: nerf_pos_projection
  
  # add tokens for the robot state
  - /tokenizers@agent.obs_encoder.t20_robot_state: linear_robot_state_tokenizer

agent:
  obs_encoder:
    embed_dim: 256

data:
  batch_size: ${floor_div:${platform.batch_size},4}  # 1/4 of typical batch size

logger:
  wandb:
    tags: ["pointcloud", "dp3"]
