# @package _global_

defaults:
  # tokenize the rgb images using a ResNet
  - /tokenizers@agent.obs_encoder.t10_image_tokenizer: image_tokenizer

agent:
  obs_encoder:
    embed_dim: 256
    t10_image_tokenizer:
      shared_encoder: False
      image_encoder:
        pretrained_weights: IMAGENET1K_V1  # null or "IMAGENET1K_V1"

  # increase size of transformer according to what David uses
  noise_model:
    decoder:
      n_layers: 6
      attention:
        n_heads: 8

logger:
  wandb:
    tags: ["rgb", "resnet18"]
