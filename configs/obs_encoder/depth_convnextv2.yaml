# @package _global_

defaults:
  # tokenize the depth map using ConvNeXtv2
  - /tokenizers@agent.obs_encoder.t10_image_tokenizer: image_tokenizer

  - override /models/vision_encoder@agent.obs_encoder.t10_image_tokenizer.image_encoder: timm_convnextv2

agent:
  obs_encoder:
    embed_dim: 256

    t10_image_tokenizer:
      shared_encoder: False
      image_type: depth
      image_encoder:
        pretrained: False

logger:
  wandb:
    tags: ["depth", "convnextv2"]
