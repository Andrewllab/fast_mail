# @package _global_

defaults:
  # tokenize the images using pretrained ConvNeXtv2
  - /tokenizers@agent.obs_encoder.t10_image_tokenizer: conv_tokenizer

  - override /models/vision_encoder@agent.obs_encoder.t10_image_tokenizer.encoder: timm_convnextv2

agent:
  obs_encoder:
    embed_dim: 256

    t10_image_tokenizer:
      image_type: rgb
      encoder:
        pretrained: False
      shared_encoder: False

data:
  batch_size: ${floor_div:${platform.batch_size},4}  # 1/4 of typical batch size

logger:
  wandb:
    tags: ["rgb", "convnextv2"]

# metadata
encoder: ConvNeXtV2
has_fourier: False
