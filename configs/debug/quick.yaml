# @package _global_

# uses only 10% of the training data

defaults:
  - verbose

# overwrite task name so debugging logs are stored in separate folder
job_type: "debug"

trainer:
  log_every_n_steps: 1  # since epochs are short, we need to log after every batch
  max_epochs: 5
  check_val_every_n_epoch: 1

data:
  batch_size: 16  # reduce batch size to ensure we have at least 1 batch
  dataset:
    load_subset: 1  # load only one trajectory
    overwrite_preprocessed: True  # don't worry about overwriting the preprocessed data since we are using a small subset

callbacks:
  model_checkpoint:
    every_n_epochs: 1  # save a checkpoint every epoch

# since we load a small subset of the data, store preprocessed data in another folder
paths:
  preprocessed_dir: ${paths.debug_preprocessed_dir}
